[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NetSentry"
version = "0.1.0"
description = "A modular intrusion detection and forensic analysis platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "scapy>=2.5.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",     # for testing FastAPI endpoints
]
report = [
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
